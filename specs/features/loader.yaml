name: loader
group: features
features:
  - name: feature-registration
    specs:
      - acceptanceCriteria: RegionLoader registers required services in ChainMail
        criticality: contract
        intent: Ensures all necessary services are available for the loader feature to function
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ServiceRegistrationTest.php
      
      - acceptanceCriteria: RegionLoader registers Container as a service
        criticality: contract
        intent: Provides service storage capability to the loader
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ContainerRegistrationTest.php
      
      - acceptanceCriteria: RegionLoader registers Schema chain as a service
        criticality: contract
        intent: Makes schema processing chain available for configuration validation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SchemaChainRegistrationTest.php
      
      - acceptanceCriteria: RegionLoader registers TransformArray chain as a service
        criticality: contract
        intent: Makes array transformation chain available for pre-processing configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/TransformArrayChainRegistrationTest.php
      
      - acceptanceCriteria: RegionLoader registers SpawnRegion chain as a service
        criticality: contract
        intent: Makes region spawning chain available for dynamic sub-region creation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnRegionChainRegistrationTest.php
      
      - acceptanceCriteria: RegionLoader registers RegionSpawnRegistry as a service
        criticality: contract
        intent: Provides registry for tracking spawn configurations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnRegistryRegistrationTest.php

      - acceptanceCriteria: RegionLoader registers ConvertYaml as a service
        criticality: contract
        intent: Makes YAML converter available for helpers to perform recursive parsing with consistent helper configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ConvertYamlRegistrationTest.php

      - acceptanceCriteria: RegionLoader registers YamlHelpers registry as a service
        criticality: contract
        intent: Provides extensible helper registration mechanism for features to add custom YAML tags
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersRegistrationTest.php

  - name: yaml-conversion
    specs:
      - acceptanceCriteria: ConvertYaml parses valid YAML string into array
        criticality: contract
        intent: Enables loading state machine configuration from YAML format
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlParsingTest.php
      
      - acceptanceCriteria: ConvertYaml processes custom YAML tags using helpers
        criticality: contract
        intent: Allows dynamic content generation in YAML using tagged values
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelperProcessingTest.php
      
      - acceptanceCriteria: ConvertYaml recursively processes nested arrays with TaggedValue instances
        criticality: constraint
        intent: Ensures helpers work at any depth in configuration structure
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/RecursiveHelperProcessingTest.php
      
      - acceptanceCriteria: ConvertYaml throws RuntimeException for undefined helper
        criticality: constraint
        intent: Provides clear error feedback when using unknown helper tags
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/UndefinedHelperErrorTest.php
      
      - acceptanceCriteria: ConvertYaml supports YAML custom tag parsing via Symfony component
        criticality: detail
        intent: Uses standard YAML parsing with PARSE_CUSTOM_TAGS flag
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlCustomTagsTest.php

  - name: yaml-helpers
    specs:
      - acceptanceCriteria: PhpEvalHelper evaluates PHP code and returns result
        criticality: contract
        intent: Allows embedding PHP expressions in YAML configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/PhpEvalHelperTest.php
      
      - acceptanceCriteria: PhpEvalHelper converts PHP errors to ErrorException
        criticality: constraint
        intent: Ensures all PHP evaluation errors are catchable exceptions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/PhpEvalErrorHandlingTest.php
      
      - acceptanceCriteria: PhpEvalHelper includes code fragment in exception message
        criticality: detail
        intent: Improves debugging by showing context around error location
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/PhpEvalErrorFragmentTest.php
      
      - acceptanceCriteria: PhpEvalHelper restores error handler after evaluation
        criticality: constraint
        intent: Prevents side effects in error handling after evaluation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/PhpEvalErrorHandlerRestorationTest.php
      
      - acceptanceCriteria: ContainerGetHelper retrieves values from container by key
        criticality: contract
        intent: Enables dependency injection in YAML configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ContainerGetHelperTest.php
      
      - acceptanceCriteria: ContainerGetHelper initializes with empty container when none provided
        criticality: detail
        intent: Provides sensible default for helper usage
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ContainerGetHelperDefaultTest.php

  - name: yaml-helper-registration
    description: Extensible YAML helper registration through YamlHelpers registry
    specs:
      - acceptanceCriteria: YamlHelpers registry stores helper functions by name
        criticality: contract
        intent: Enables features to contribute custom YAML tags by registering helper functions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersStorageTest.php

      - acceptanceCriteria: YamlHelpers registry returns empty array when no helpers registered
        criticality: detail
        intent: Provides sensible default for helper registry with no custom helpers
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersEmptyTest.php

      - acceptanceCriteria: YamlHelpers registry allows features to register multiple helpers
        criticality: contract
        intent: Supports features adding multiple custom YAML tags in single registration call
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersMultipleTest.php

      - acceptanceCriteria: YamlHelpers registry throws exception when duplicate helper name registered
        criticality: constraint
        intent: Prevents helper conflicts by requiring unique names ensuring predictable YAML parsing behavior
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersDuplicateErrorTest.php

      - acceptanceCriteria: ConvertYaml retrieves helpers from YamlHelpers registry
        criticality: contract
        intent: Uses dynamically registered helpers instead of static configuration enabling feature extensibility
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ConvertYamlUsesRegistryTest.php

      - acceptanceCriteria: ConvertYaml merges registry helpers with constructor-provided helpers
        criticality: contract
        intent: Supports both feature-registered helpers and user-provided helpers with constructor helpers taking precedence
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ConvertYamlMergesHelpersTest.php

  - name: yaml-include-helpers
    description: File inclusion helpers for modular YAML composition
    specs:
      - acceptanceCriteria: RegionLoader declares dependency on IncludesFeature via RequiresFeature attribute
        criticality: contract
        intent: Ensures LoadFile chain is available through automatic dependency resolution
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/RequiresIncludesFeatureTest.php

      - acceptanceCriteria: "RegionLoader registers !include helper that uses LoadFile chain and ConvertYaml service from ChainMail"
        criticality: contract
        intent: Enables recursive YAML includes by reusing configured ConvertYaml instance for consistent helper availability across nesting levels
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeHelperTest.php

      - acceptanceCriteria: "RegionLoader registers !includeRelative helper that uses LoadFile chain and ConvertYaml service from ChainMail"
        criticality: contract
        intent: Enables recursive relative includes by reusing configured ConvertYaml instance with updated current file context
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeHelperTest.php

      - acceptanceCriteria: "!include resolves paths relative to configured basePath"
        criticality: contract
        intent: Provides predictable path resolution regardless of nesting depth using loader.array.includes.basePath
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeBasePathTest.php

      - acceptanceCriteria: "!include defaults to current working directory when basePath not configured"
        criticality: detail
        intent: Provides sensible default behavior using getcwd() as fallback basePath
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeDefaultBasePathTest.php

      - acceptanceCriteria: "!includeRelative first invocation resolves paths relative to basePath"
        criticality: contract
        intent: Uses basePath for initial include since no current file context exists yet
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeFirstInvocationTest.php

      - acceptanceCriteria: "!includeRelative subsequent invocations resolve paths relative to current file"
        criticality: contract
        intent: Enables portable YAML modules by resolving paths relative to the file being parsed after first invocation
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeSubsequentTest.php

      - acceptanceCriteria: "!include and !includeRelative replace tag with parsed YAML content"
        criticality: contract
        intent: Allows seamless composition of YAML structures by substituting include tags with file contents
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeReplacementTest.php

      - acceptanceCriteria: Include helpers use LoadFile chain to load file contents
        criticality: contract
        intent: Leverages extensible file loading infrastructure with middleware support for caching and path resolution
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeUsesLoadFileChainTest.php

      - acceptanceCriteria: "Nested !includeRelative maintains relative path chain through current file tracking"
        criticality: contract
        intent: Ensures correct path resolution in deeply nested relative includes by updating current file context
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeNestedTest.php

      - acceptanceCriteria: "!include re-parses included YAML with same helpers"
        criticality: contract
        intent: Enables nested includes and recursive YAML composition with consistent helper availability
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRecursiveTest.php

      - acceptanceCriteria: "!includeRelative re-parses included YAML with updated helper context"
        criticality: contract
        intent: Updates current file reference in helpers to maintain correct relative resolution chain
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeRecursiveTest.php

      - acceptanceCriteria: "!include handles absolute paths without basePath modification"
        criticality: constraint
        intent: Allows explicit absolute paths to bypass basePath resolution for system-level includes
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeAbsolutePathTest.php

      - acceptanceCriteria: "!includeRelative handles absolute paths without relative resolution"
        criticality: constraint
        intent: Allows explicit absolute paths to bypass current file resolution for system-level includes
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeRelativeAbsolutePathTest.php

      - acceptanceCriteria: Include helpers throw RuntimeException when LoadFile chain fails
        criticality: constraint
        intent: Propagates clear error feedback when included files are missing or inaccessible
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/IncludeFileErrorTest.php

      - acceptanceCriteria: "Nested !include preserves all registered helpers from YamlHelpers registry"
        criticality: contract
        intent: Validates that custom helpers registered by features work correctly in deeply nested includes
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Loader/NestedIncludePreservesHelpersTest.php

  - name: include-depth-limiting
    description: Prevent infinite recursion in nested includes via depth tracking in helpers
    specs:
      - acceptanceCriteria: IncludeHelper tracks recursion depth across nested YAML includes
        criticality: contract
        intent: Automatically monitors nested includes without requiring consumers to manually track depth, preventing infinite recursion
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthTrackingTest.php

      - acceptanceCriteria: IncludeRelativeHelper tracks recursion depth across nested YAML includes
        criticality: contract
        intent: Automatically monitors nested relative includes without requiring consumers to manually track depth, preventing infinite recursion
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeRelativeHelperDepthTrackingTest.php

      - acceptanceCriteria: IncludeHelper throws RuntimeException when recursion depth exceeds MAX_INCLUDE_DEPTH
        criticality: constraint
        intent: Enforces depth limit preventing stack overflow with clear error message indicating the problematic file path
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthEnforcementTest.php

      - acceptanceCriteria: IncludeRelativeHelper throws RuntimeException when recursion depth exceeds MAX_INCLUDE_DEPTH
        criticality: constraint
        intent: Enforces depth limit preventing stack overflow with clear error message indicating the problematic file path
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeRelativeHelperDepthEnforcementTest.php

      - acceptanceCriteria: Include helpers increment depth before recursive ConvertYaml invocation
        criticality: constraint
        intent: Ensures depth is tracked before processing nested YAML content, preventing bypasses
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthIncrementTimingTest.php

      - acceptanceCriteria: Include helpers reset depth tracking after successful or failed invocation
        criticality: constraint
        intent: Properly cleans up depth tracking when returning from nested calls, preventing depth accumulation across unrelated invocations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthResetTest.php

      - acceptanceCriteria: Include helpers maintain independent depth counters per helper instance
        criticality: constraint
        intent: Ensures parallel include chains don't interfere with each other's depth tracking
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthIndependenceTest.php

      - acceptanceCriteria: Include helpers use MAX_INCLUDE_DEPTH constant of 10 as default limit
        criticality: detail
        intent: Provides reasonable default depth limit that prevents most accidental recursion while allowing practical nesting
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/IncludeHelperDepthLimitDefaultTest.php

  - name: array-processing
    specs:
      - acceptanceCriteria: ProcessArray validates configuration against schema
        criticality: contract
        intent: Ensures configuration structure is correct before processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SchemaValidationTest.php
      
      - acceptanceCriteria: ProcessArray throws RuntimeException with validation details for invalid schema
        criticality: constraint
        intent: Provides clear feedback about configuration errors
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ValidationErrorMessageTest.php
      
      - acceptanceCriteria: ProcessArray extracts states from configuration
        criticality: contract
        intent: Identifies all state definitions for region building
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/StateExtractionTest.php
      
      - acceptanceCriteria: ProcessArray extracts nested regions from configuration
        criticality: contract
        intent: Supports hierarchical state machine structures
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/NestedRegionExtractionTest.php
      
      - acceptanceCriteria: ProcessArray extracts transitions from configuration
        criticality: contract
        intent: Identifies all transition definitions for state changes
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/TransitionExtractionTest.php
      
      - acceptanceCriteria: ProcessArray extracts onEnter callbacks from configuration
        criticality: contract
        intent: Identifies entry actions for states
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/OnEnterExtractionTest.php
      
      - acceptanceCriteria: ProcessArray extracts onExit callbacks from configuration
        criticality: contract
        intent: Identifies exit actions for states
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/OnExitExtractionTest.php
      
      - acceptanceCriteria: ProcessArray extracts action callbacks from configuration
        criticality: contract
        intent: Identifies action handlers for states
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ActionExtractionTest.php
      
      - acceptanceCriteria: ProcessArray applies states to RegionBuilder
        criticality: contract
        intent: Configures builder with extracted state definitions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/StateApplicationTest.php
      
      - acceptanceCriteria: ProcessArray creates and connects nested regions with proper flags
        criticality: contract
        intent: Establishes hierarchical region structure with event propagation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/NestedRegionConnectionTest.php
      
      - acceptanceCriteria: ProcessArray adds transitions using AddTransition build step
        criticality: contract
        intent: Configures region transitions from extracted definitions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/TransitionApplicationTest.php
      
      - acceptanceCriteria: ProcessArray registers onEnter callbacks with builder
        criticality: contract
        intent: Configures state entry actions from extracted callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/OnEnterRegistrationTest.php
      
      - acceptanceCriteria: ProcessArray registers onExit callbacks with builder
        criticality: contract
        intent: Configures state exit actions from extracted callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/OnExitRegistrationTest.php
      
      - acceptanceCriteria: ProcessArray registers action callbacks with builder
        criticality: contract
        intent: Configures state action handlers from extracted callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ActionRegistrationTest.php
      
      - acceptanceCriteria: ProcessArray marks initial state when specified in configuration
        criticality: contract
        intent: Sets starting state for region
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InitialStateMarkingTest.php
      
      - acceptanceCriteria: ProcessArray marks final state when specified in configuration
        criticality: contract
        intent: Sets terminating state for region
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/FinalStateMarkingTest.php
      
      - acceptanceCriteria: ProcessArray sets inherits property when specified in configuration
        criticality: contract
        intent: Supports state template inheritance
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InheritsPropertyTest.php
      
      - acceptanceCriteria: ProcessArray sets factory when specified in configuration
        criticality: contract
        intent: Allows custom region instantiation logic
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/FactorySettingTest.php
      
      - acceptanceCriteria: ProcessArray creates new builder instance for nested regions
        criticality: constraint
        intent: Isolates sub-region configuration from parent builder
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/NestedBuilderIsolationTest.php
      
      - acceptanceCriteria: ProcessArray clones callback closures for uniqueness
        criticality: constraint
        intent: Prevents coroutine connection issues between shared regions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/CallbackCloningTest.php

  - name: guard-and-callback-creation
    specs:
      - acceptanceCriteria: ProcessArray creates default always-true guard when none specified
        criticality: detail
        intent: Provides convenient default for unconditional transitions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/DefaultGuardCreationTest.php
      
      - acceptanceCriteria: ProcessArray creates guard closure from callable definition
        criticality: contract
        intent: Converts configuration guard into executable predicate
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/GuardClosureCreationTest.php
      
      - acceptanceCriteria: ProcessArray throws RuntimeException for invalid guard callback
        criticality: constraint
        intent: Validates guard configuration at build time
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InvalidGuardErrorTest.php
      
      - acceptanceCriteria: ProcessArray creates state callback closure from run definition
        criticality: contract
        intent: Converts configuration callback into executable action
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/StateCallbackCreationTest.php
      
      - acceptanceCriteria: ProcessArray throws RuntimeException for invalid run callback
        criticality: constraint
        intent: Validates callback configuration at build time
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InvalidCallbackErrorTest.php
      
      - acceptanceCriteria: ProcessArray creates factory closure from callable definition
        criticality: contract
        intent: Converts configuration factory into executable function
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/FactoryClosureCreationTest.php
      
      - acceptanceCriteria: ProcessArray throws RuntimeException for invalid factory
        criticality: constraint
        intent: Validates factory configuration at build time
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InvalidFactoryErrorTest.php

  - name: builder-integration
    specs:
      - acceptanceCriteria: RegionLoader intercepts build process when loader args present
        criticality: contract
        intent: Enables YAML/array-based region construction
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/BuilderInterceptionTest.php
      
      - acceptanceCriteria: RegionLoader passes through build when no loader args present
        criticality: constraint
        intent: Allows normal builder operation without loader configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/BuilderPassthroughTest.php
      
      - acceptanceCriteria: RegionLoader loads YAML from file path when yaml arg is readable file
        criticality: contract
        intent: Supports loading configuration from external files
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/FilePathLoadingTest.php
      
      - acceptanceCriteria: RegionLoader treats yaml arg as string when not a readable file
        criticality: contract
        intent: Supports inline YAML configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/InlineYamlLoadingTest.php
      
      - acceptanceCriteria: RegionLoader converts yaml to array before processing
        criticality: constraint
        intent: Normalizes configuration format for downstream processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlToArrayConversionTest.php
      
      - acceptanceCriteria: RegionLoader processes array configuration through ProcessArray
        criticality: contract
        intent: Applies array configuration to builder
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/ArrayProcessingTest.php
      
      - acceptanceCriteria: RegionLoader uses yamlHelpers when converting YAML
        criticality: contract
        intent: Enables custom tag processing in YAML
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/YamlHelpersUsageTest.php
      
      - acceptanceCriteria: RegionLoader uses empty helpers array when yamlHelpers not provided
        criticality: detail
        intent: Allows YAML loading without custom helpers
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/DefaultHelpersTest.php

  - name: spawn-schema-extension
    specs:
      - acceptanceCriteria: RegionLoader extends state schema with spawn property
        criticality: contract
        intent: Enables declarative sub-region spawning in configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnSchemaExtensionTest.php
      
      - acceptanceCriteria: Spawn schema accepts guard property
        criticality: contract
        intent: Allows conditional spawning based on trigger evaluation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnGuardSchemaTest.php
      
      - acceptanceCriteria: Spawn schema accepts region property as array
        criticality: contract
        intent: Defines configuration for spawned sub-region
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnRegionSchemaTest.php
      
      - acceptanceCriteria: Spawn schema accepts shared property as array
        criticality: contract
        intent: Configures data sharing between parent and spawned region
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnSharedSchemaTest.php
      

      - acceptanceCriteria: State schema is extended with spawn list
        criticality: constraint
        intent: Updates schema object to include spawn definitions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/StateSchemaSpawnExtensionTest.php

  - name: spawn-processing
    specs:
      - acceptanceCriteria: RegionLoader processes spawn definitions from state configuration
        criticality: contract
        intent: Creates spawn records for dynamic sub-region creation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnDefinitionProcessingTest.php
      
      - acceptanceCriteria: RegionLoader skips states without spawn definitions
        criticality: constraint
        intent: Avoids unnecessary processing for non-spawning states
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnSkippingTest.php
      
      - acceptanceCriteria: RegionLoader creates region spawn step for each spawn definition
        criticality: contract
        intent: Registers spawning logic with region builder
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnStepCreationTest.php
      
      - acceptanceCriteria: RegionLoader uses guard from spawn definition
        criticality: contract
        intent: Applies conditional logic to spawn decision
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnGuardUsageTest.php
      
      - acceptanceCriteria: RegionLoader creates sub-region from region definition
        criticality: contract
        intent: Instantiates configured sub-region for spawning
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SubRegionCreationTest.php
      
      - acceptanceCriteria: RegionLoader merges spawn shared config with default sharing
        criticality: detail
        intent: Combines user config with sensible defaults for data sharing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnSharedMergingTest.php
      
      - acceptanceCriteria: RegionLoader sets default meta sharing to true
        criticality: detail
        intent: Enables metadata propagation to spawned regions by default
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/DefaultMetaSharingTest.php
      
      - acceptanceCriteria: RegionLoader applies DYNAMIC, RECEIVE_EVENTS, and RECEIVE_ACTIONS flags by default
        criticality: detail
        intent: Configures spawned region with standard event handling
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/DefaultConnectionFlagsTest.php
      
      - acceptanceCriteria: RegionLoader includes RECEIVE_META flag when meta sharing enabled
        criticality: constraint
        intent: Ensures metadata flows to spawned region when configured
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/MetaFlagApplicationTest.php
      
      - acceptanceCriteria: RegionLoader creates new builder instance for sub-region
        criticality: constraint
        intent: Isolates sub-region builder from parent configuration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SubRegionBuilderIsolationTest.php

  - name: spawn-step-execution
    specs:
      - acceptanceCriteria: regionSpawnStep returns closure accepting builder and next
        criticality: contract
        intent: Provides middleware-compatible build step interface
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnStepInterfaceTest.php
      
      - acceptanceCriteria: regionSpawnStep retrieves RegionSpawnRegistry from ChainMail
        criticality: constraint
        intent: Accesses registry service for spawn record storage
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnStepRegistryRetrievalTest.php
      
      - acceptanceCriteria: regionSpawnStep calls next to build region
        criticality: constraint
        intent: Continues builder chain to complete region construction
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnStepContinuationTest.php
      
      - acceptanceCriteria: regionSpawnStep creates RegionSpawnRecord with provided parameters
        criticality: contract
        intent: Encapsulates spawn configuration for later execution
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnRecordCreationTest.php
      
      - acceptanceCriteria: regionSpawnStep adds spawn record to registry
        criticality: contract
        intent: Registers spawn configuration for action-based triggering
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnRecordRegistrationTest.php
      
      - acceptanceCriteria: regionSpawnStep returns built region
        criticality: constraint
        intent: Provides region for further configuration or use
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnStepReturnTest.php

  - name: spawn-execution
    specs:
      - acceptanceCriteria: RegionLoader checks spawn registry on every action dispatch
        criticality: contract
        intent: Evaluates spawn conditions whenever actions occur
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnCheckOnActionTest.php
      
      - acceptanceCriteria: SpawnRegion checks parameter compatibility with trigger payload
        criticality: constraint
        intent: Ensures guard can be called with current trigger type
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnParameterCompatibilityTest.php
      
      - acceptanceCriteria: SpawnRegion returns null when parameter incompatible
        criticality: constraint
        intent: Skips spawning when guard signature doesn't match trigger
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnParameterIncompatibilityTest.php
      
      - acceptanceCriteria: SpawnRegion evaluates guard predicate with trigger payload
        criticality: contract
        intent: Determines whether to spawn sub-region based on trigger
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnGuardEvaluationTest.php
      
      - acceptanceCriteria: SpawnRegion returns null when guard returns false
        criticality: constraint
        intent: Prevents spawning when guard condition not met
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnGuardFalseTest.php
      
      - acceptanceCriteria: SpawnRegion invokes region factory when guard returns true
        criticality: contract
        intent: Creates sub-region instance when spawn condition met
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnFactoryInvocationTest.php
      
      - acceptanceCriteria: SpawnRegion creates Connection with parent region and sub-region
        criticality: contract
        intent: Establishes communication link between regions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Loader/SpawnConnectionCreationTest.php
      
