name: async
group: features
description: The AsyncFeature enables asynchronous execution patterns within state machines through coroutines, providing cooperative multitasking with generators, automatic task scheduling, lazy resolution of context values with dependency tracking, and non-blocking I/O operations

features:
  - name: feature-registration
    description: Feature initialization and service registration in ChainMail
    specs:
      - acceptanceCriteria: AsyncFeature registers Enqueue chain in ChainMail
        criticality: constraint
        intent: Provides the task enqueueing mechanism through Enqueue chain registration, enabling tasks to be added to the scheduler for regions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/RegistersEnqueueChainTest.php
        
      - acceptanceCriteria: AsyncFeature registers Resolvers service in ChainMail
        criticality: constraint
        intent: Provides centralized resolver storage through Resolvers service registration, enabling per-region resolver management and lazy evaluation of context properties
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/RegistersResolversServiceTest.php
        
      - acceptanceCriteria: AsyncFeature hooks into InvokeCallback chain to detect generators
        criticality: contract
        intent: Intercepts callback invocation to detect generator-based async functions, automatically converting them to managed coroutines and returning yielded values to maintain transparent async behavior
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/HooksIntoInvokeCallbackTest.php
        
      - acceptanceCriteria: AsyncFeature hooks into Meta chain to trigger resolver evaluation
        criticality: contract
        intent: Intercepts metadata access to initialize lazy resolvers when context properties are accessed, enabling on-demand computation while tracking dependencies for cache invalidation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/HooksIntoMetaChainTest.php
        
      - acceptanceCriteria: AsyncFeature extends loader schema to accept resolver definitions
        criticality: contract
        intent: Enables YAML-based resolver configuration by extending RegionLoader schema with resolvers field, allowing declarative async property definitions alongside states and transitions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/ExtendsLoaderSchemaTest.php

  - name: coroutine-scheduler
    description: Task scheduling and cooperative multitasking
    specs:
      - acceptanceCriteria: CoroutineScheduler enqueues generators as tasks
        criticality: contract
        intent: Wraps generators in Task objects and adds them to execution queue, enabling cooperative multitasking where generators yield control back to scheduler
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/EnqueuesGeneratorsTest.php
        
      - acceptanceCriteria: CoroutineScheduler prevents duplicate task enqueueing for same generator
        criticality: constraint
        intent: Returns existing task when generator is already enqueued, preventing duplicate execution of same coroutine and maintaining task identity across multiple enqueue calls
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/PreventsDuplicateEnqueueTest.php
        
      - acceptanceCriteria: CoroutineScheduler executes tasks cooperatively during tick
        criticality: contract
        intent: Advances each enqueued task by one step during tick cycle, implementing cooperative multitasking where tasks voluntarily yield control enabling interleaved execution
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/ExecutesTasksCooperativelyTest.php
        
      - acceptanceCriteria: CoroutineScheduler skips paused tasks during tick
        criticality: contract
        intent: Excludes paused tasks from execution cycle, enabling controlled suspension for async operations like I/O or event waiting without blocking other tasks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/SkipsPausedTasksTest.php
        
      - acceptanceCriteria: CoroutineScheduler removes completed tasks from queue
        criticality: constraint
        intent: Automatically dequeues finished tasks to prevent unnecessary iteration and free resources, while triggering registered completion callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/RemovesCompletedTasksTest.php
        
      - acceptanceCriteria: CoroutineScheduler stores last yielded value per task
        criticality: contract
        intent: Caches most recent yielded value enabling synchronous retrieval after tick, supporting scenarios where caller needs immediate access to task progress
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/StoresLastYieldedValueTest.php
        
      - acceptanceCriteria: CoroutineScheduler supports task pause and resume
        criticality: contract
        intent: Enables explicit task suspension through pause/resume API, supporting async operations that need to wait for external events or conditions before continuing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/SupportsPauseResumeTest.php
        
      - acceptanceCriteria: CoroutineScheduler tracks completion callbacks per task
        criticality: contract
        intent: Allows registration of callbacks executed when task finishes, enabling cleanup logic and dependent task chaining without polling task state
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/TracksCompletionCallbacksTest.php
        
      - acceptanceCriteria: CoroutineScheduler prevents reentrant tick execution
        criticality: constraint
        intent: Guards against nested tick calls using busy flag, preventing stack overflow and maintaining predictable execution order when ticks are triggered within callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/PreventsReentrantTickTest.php
        
      - acceptanceCriteria: CoroutineScheduler handles Call objects during task execution
        criticality: contract
        intent: Invokes Call objects with task and scheduler when yielded, enabling control flow operations like fork, wait, cancel that require scheduler access
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Scheduler/HandlesCallObjectsTest.php

  - name: task-management
    description: Task wrapping and state tracking
    specs:
      - acceptanceCriteria: Task wraps generator and tracks execution state
        criticality: contract
        intent: Encapsulates generator with execution state tracking, providing unified interface for scheduler to advance coroutines and check completion status
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/WrapsGeneratorTest.php
        
      - acceptanceCriteria: Task advances generator on run call
        criticality: contract
        intent: Progresses generator by one yield on each run invocation, returning current yielded value to scheduler for processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/AdvancesOnRunTest.php
        
      - acceptanceCriteria: Task sends values into generator via setSendValue
        criticality: contract
        intent: Enables bi-directional communication by injecting values at yield points, supporting coroutine patterns where async operations return results to generator
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/SendsValuesTest.php
        
      - acceptanceCriteria: Task retrieves generator return value after completion
        criticality: contract
        intent: Exposes final generator return value through getReturn, enabling completed coroutines to provide results to dependent code
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/RetrievesReturnValueTest.php
        
      - acceptanceCriteria: Task reports completion status via isFinished
        criticality: contract
        intent: Indicates when generator has completed execution through isFinished flag, allowing scheduler to detect and remove finished tasks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/ReportsCompletionStatusTest.php
        
      - acceptanceCriteria: Task handles initial yield without send
        criticality: constraint
        intent: Returns first yielded value using current() instead of send() on initial run, respecting generator protocol where send before first yield is invalid
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Task/HandlesInitialYieldTest.php

  - name: call-helpers
    description: Control flow helpers for async operations
    specs:
      - acceptanceCriteria: Call.waitForSecs pauses task for specified duration
        criticality: contract
        intent: Enables time-based delays in coroutines by pausing task and spawning timer coroutine, supporting rate limiting and scheduled operations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/WaitForSecsTest.php
        
      - acceptanceCriteria: Call.call spawns nested coroutine and waits for completion
        criticality: contract
        intent: Enables coroutine composition by spawning child task, pausing parent until child completes, and injecting child return value supporting hierarchical async workflows
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/CallTest.php
        
      - acceptanceCriteria: Call.fork spawns independent coroutine without waiting
        criticality: contract
        intent: Enables fire-and-forget async operations by spawning task without blocking parent, injecting forked task reference for optional tracking
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/ForkTest.php
        
      - acceptanceCriteria: Call.cancel terminates specified task
        criticality: contract
        intent: Enables explicit task termination from other coroutines, supporting cancellation patterns and resource cleanup for obsolete operations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/CancelTest.php
        
      - acceptanceCriteria: Call.take pauses task until matching event occurs
        criticality: contract
        intent: Enables event-driven async by pausing task until listener receives matching event, injecting event to resume execution supporting reactive patterns
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/TakeTest.php
        
      - acceptanceCriteria: Call.takeAny pauses task until any matching event occurs
        criticality: contract
        intent: Enables waiting for multiple event types by accepting multiple matchers, resuming on first match supporting flexible event handling
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/TakeAnyTest.php
        
      - acceptanceCriteria: Call.wager registers task cancellation on matching event
        criticality: contract
        intent: Enables interrupt-driven patterns by registering event listener that cancels task when event matches, optionally spawning replacement task
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/WagerTest.php
        
      - acceptanceCriteria: Call objects invoke callback with task and scheduler
        criticality: contract
        intent: Provides access to scheduler and current task when Call is yielded, enabling control flow operations to manipulate task state and spawn new tasks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Call/InvokesWithContextTest.php

  - name: ornament-resolution
    description: Lazy evaluation with dependency tracking for mesh properties
    specs:
      - acceptanceCriteria: Ornament extends mesh with lazy resolution middleware
        criticality: contract
        intent: Intercepts mesh property access to trigger lazy evaluation, enabling computed properties that resolve only when accessed
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/ExtendsMeshTest.php
        
      - acceptanceCriteria: Ornament tracks dependencies during resolution
        criticality: contract
        intent: Records which mesh properties are accessed during resolver execution, enabling automatic cache invalidation when dependencies change
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/TracksDependenciesTest.php
        
      - acceptanceCriteria: Ornament caches resolved values
        criticality: contract
        intent: Stores computed result to avoid redundant resolution on subsequent access, improving performance for expensive computations until dependencies change
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/CachesResolvedValuesTest.php
        
      - acceptanceCriteria: Ornament invalidates cache when dependencies change
        criticality: contract
        intent: Resets cached value when tracked dependency is modified via offsetSet or offsetUnset, ensuring stale computed values are never returned
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/InvalidatesCacheOnDependencyChangeTest.php
        
      - acceptanceCriteria: Ornament prevents infinite resolution loops
        criticality: constraint
        intent: Uses resolving flag to prevent recursive resolution attempts when resolver accesses its own key, protecting against stack overflow
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/PreventsInfiniteLoopsTest.php
        
      - acceptanceCriteria: Ornament returns cached value on repeat access
        criticality: contract
        intent: Immediately returns stored result on subsequent offsetGet without triggering resolver, enabling efficient repeated property access
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/ReturnsCachedValueTest.php
        
      - acceptanceCriteria: Ornament handles synchronous resolution
        criticality: contract
        intent: Detects when resolver completes synchronously and immediately returns result, supporting both sync and async resolvers with same API
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/HandlesSyncResolutionTest.php
        
      - acceptanceCriteria: OrnamentResolver provides mesh access during resolution
        criticality: contract
        intent: Exposes get and has methods to resolver callback, enabling resolvers to read mesh properties while tracking dependencies
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/ResolverProvidesMeshAccessTest.php
        
      - acceptanceCriteria: OrnamentResolver triggers resolution callback with result
        criticality: contract
        intent: Invokes provided callback with computed value when resolver calls resolve method, enabling async resolution where resolver completes later
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Ornament/ResolverTriggersCallbackTest.php

  - name: resolver-registry
    description: Storage and retrieval of resolver configurations per region
    specs:
      - acceptanceCriteria: Resolvers stores resolver records per region
        criticality: contract
        intent: Maintains mapping of resolver name to callback per region instance, enabling per-region resolver configurations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Resolvers/StoresResolverRecordsTest.php
        
      - acceptanceCriteria: Resolvers retrieves specific resolver by region and key
        criticality: contract
        intent: Enables lookup of resolver callback for specific property on specific region, supporting dynamic resolver retrieval during mesh access
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Resolvers/RetrievesResolverTest.php
        
      - acceptanceCriteria: Resolvers checks resolver existence for region and key
        criticality: contract
        intent: Provides existence check before retrieval to avoid exceptions, enabling conditional resolver usage in middleware
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Resolvers/ChecksExistenceTest.php
        
      - acceptanceCriteria: Resolvers retrieves all resolvers for a region
        criticality: contract
        intent: Returns complete resolver set for region enabling ornament creation for all configured lazy properties during meta chain processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Resolvers/RetrievesAllForRegionTest.php
        
      - acceptanceCriteria: ResolverRecord stores region, key, and resolver callback
        criticality: contract
        intent: Encapsulates resolver metadata as immutable record with readonly properties, ensuring resolver configurations cannot be modified after registration
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/Resolvers/ResolverRecordStructureTest.php

  - name: io-operations
    description: Non-blocking I/O operations with generators
    specs:
      - acceptanceCriteria: Fetch performs HTTP request as generator
        criticality: contract
        intent: Enables non-blocking HTTP requests by yielding during I/O operations, supporting concurrent requests within single coroutine scheduler
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/FetchTest.php
        
      - acceptanceCriteria: Fetch compiles custom headers into request
        criticality: contract
        intent: Allows custom HTTP headers to be specified via constructor, enabling authentication, content negotiation, and custom protocols
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/FetchCompilesHeadersTest.php
        
      - acceptanceCriteria: Fetch supports different HTTP methods
        criticality: contract
        intent: Enables POST, PUT, DELETE operations via method parameter, supporting full REST API interactions beyond GET requests
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/FetchSupportsMethodsTest.php
        
      - acceptanceCriteria: Fetch returns response wrapper data
        criticality: contract
        intent: Provides access to HTTP response headers and metadata via generator return value, enabling status code checking and header inspection
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/FetchReturnsMetadataTest.php
        
      - acceptanceCriteria: Exec executes shell command as generator
        criticality: contract
        intent: Enables non-blocking command execution by yielding output as it arrives, supporting concurrent process execution
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/ExecTest.php
        
      - acceptanceCriteria: Exec yields command output incrementally
        criticality: contract
        intent: Streams stdout as it becomes available through yields, enabling real-time output processing for long-running commands
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/ExecYieldsOutputTest.php
        
      - acceptanceCriteria: Exec returns exit code after completion
        criticality: contract
        intent: Provides process exit status via generator return, enabling error detection and conditional logic based on command success
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/ExecReturnsExitCodeTest.php
        
      - acceptanceCriteria: Exec respects timeout parameter
        criticality: contract
        intent: Terminates long-running processes after timeout expires, preventing resource exhaustion from hung commands
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/ExecRespectsTimeoutTest.php
        
      - acceptanceCriteria: Load reads file as generator
        criticality: contract
        intent: Enables non-blocking file reading by yielding during I/O operations, supporting concurrent file processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/LoadTest.php
        
      - acceptanceCriteria: StreamHandler reads resource incrementally
        criticality: contract
        intent: Yields each character or chunk from stream resource, enabling progressive processing of large streams without buffering entire content
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/StreamHandlerTest.php
        
      - acceptanceCriteria: StreamHandler detects stream timeout
        criticality: constraint
        intent: Throws exception when stream read times out based on metadata, preventing indefinite hangs on stalled streams
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/StreamHandlerTimeoutTest.php
        
      - acceptanceCriteria: StreamHandler returns wrapper metadata
        criticality: contract
        intent: Provides stream metadata via generator return, enabling access to protocol-specific information after stream completes
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/IO/StreamHandlerMetadataTest.php

  - name: async-callback-handling
    description: Automatic detection and management of generator-based callbacks
    specs:
      - acceptanceCriteria: AsyncFeature creates CoroutineScheduler per region on first async callback
        criticality: constraint
        intent: Lazily initializes scheduler when async callback detected, avoiding overhead for regions that never use async operations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/CreatesSchedulerPerRegionTest.php
        
      - acceptanceCriteria: AsyncFeature tracks Task-to-callback mapping
        criticality: constraint
        intent: Maintains weak reference between callback and its task enabling subsequent invocations to resume existing task rather than spawn duplicate
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/TracksCallbackTaskMappingTest.php
        
      - acceptanceCriteria: AsyncFeature resumes existing task on repeat callback invocation
        criticality: contract
        intent: Kicks scheduler and returns last yielded value when callback invoked again, supporting stateful async actions that progress over multiple triggers
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/ResumesExistingTaskTest.php
        
      - acceptanceCriteria: AsyncFeature enqueues new generators as tasks
        criticality: contract
        intent: Wraps generator in task and adds to scheduler when callback returns generator, initiating cooperative multitasking for async action
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/EnqueuesNewGeneratorsTest.php
        
      - acceptanceCriteria: AsyncFeature ticks scheduler after synchronous callbacks
        criticality: constraint
        intent: Progresses all enqueued tasks after normal callback completes, ensuring async tasks make progress even when callbacks are synchronous
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/TicksAfterSyncCallbackTest.php
        
      - acceptanceCriteria: AsyncFeature clears callback mapping on task completion
        criticality: constraint
        intent: Removes weak reference when task finishes to allow fresh task creation on next invocation, preventing completed tasks from blocking new executions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/ClearsCompletedTaskMappingTest.php

  - name: resolver-integration
    description: Integration of async resolvers with state machine context
    specs:
      - acceptanceCriteria: AsyncFeature creates ornaments for all region resolvers
        criticality: contract
        intent: Initializes lazy resolution for each configured resolver when context meta accessed, enabling automatic async property evaluation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/CreatesOrnamentsForResolversTest.php
        
      - acceptanceCriteria: AsyncFeature processes resolver callbacks through prepare and invoke chains
        criticality: contract
        intent: Applies middleware transformations to resolver callbacks ensuring consistent behavior with regular actions including parameter injection
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/ProcessesResolverCallbacksTest.php
        
      - acceptanceCriteria: AsyncFeature wraps resolver in generator that waits for completion
        criticality: contract
        intent: Enqueues resolver as task and yields until complete, ensuring ornament resolution completes asynchronously when resolver is async
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/WrapsResolverInGeneratorTest.php
        
      - acceptanceCriteria: AsyncFeature resolves ornament with task return value
        criticality: contract
        intent: Triggers ornament resolution callback with task result on completion, providing computed value to mesh for caching
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/ResolvesOrnamentWithResultTest.php
        
      - acceptanceCriteria: AsyncFeature initializes ornaments once per region
        criticality: constraint
        intent: Uses observer storage to prevent redundant ornament creation on repeated meta access, optimizing for multiple context property reads
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/InitializesOrnamentsOnceTest.php
        
      - acceptanceCriteria: AsyncFeature registers resolvers during build phase from loader config
        criticality: contract
        intent: Processes resolver definitions from YAML during region build, populating Resolvers service with configured callbacks
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Async/RegistersResolversFromConfigTest.php

  - name: integration
    description: Full async workflows combining multiple components
    specs:
      - acceptanceCriteria: Async action progresses through multiple yields across triggers
        criticality: contract
        intent: Demonstrates stateful async actions that resume on subsequent events, enabling multi-step operations spanning multiple state transitions
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/MultiStepAsyncActionTest.php
        
      - acceptanceCriteria: Multiple concurrent async actions execute cooperatively
        criticality: contract
        intent: Validates concurrent task execution where multiple actions yield and resume interleaved, demonstrating cooperative multitasking
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/ConcurrentActionsTest.php
        
      - acceptanceCriteria: Async resolver computes value only when property accessed
        criticality: contract
        intent: Confirms lazy evaluation where resolver does not execute until mesh property read, optimizing for unused computed properties
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/LazyResolverTest.php
        
      - acceptanceCriteria: Resolver cache invalidates and recomputes on dependency change
        criticality: contract
        intent: Verifies dependency tracking where resolver recomputes when accessed properties change, ensuring fresh values
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/ResolverCacheInvalidationTest.php
        
      - acceptanceCriteria: Call.call nests coroutines and returns child result to parent
        criticality: contract
        intent: Demonstrates coroutine composition where child completes, parent resumes with result, enabling hierarchical async workflows
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/NestedCoroutinesTest.php
        
      - acceptanceCriteria: Call.fork spawns independent task without blocking parent
        criticality: contract
        intent: Shows fire-and-forget pattern where forked task runs concurrently while parent continues, enabling background operations
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/ForkIndependentTaskTest.php
        
      - acceptanceCriteria: Region with async resolvers loads from YAML configuration
        criticality: contract
        intent: Validates end-to-end YAML loading with resolver definitions producing working async context properties
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/LoadsResolversFromYamlTest.php
        
      - acceptanceCriteria: Async I/O operations complete without blocking scheduler
        criticality: contract
        intent: Confirms non-blocking I/O where file/HTTP operations yield allowing other tasks to progress during I/O waits
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Async/NonBlockingIOTest.php
