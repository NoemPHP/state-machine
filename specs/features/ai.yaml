name: ai
group: features
description: The AiFeature enables AI-powered text generation and completion within state machines with multi-backend support (OpenAI, Ollama, Anthropic). Provides template helpers for completion and structured extraction, request building with configurable parameters, streaming and non-streaming response handling, backend mesh infrastructure, provider-specific prompt formatting, and optional credential injection

features:
  - name: feature-registration
    description: Feature initialization and service registration in ChainMail
    specs:
      - acceptanceCriteria: AiFeature registers SystemPrompt chain in ChainMail
        criticality: constraint
        intent: Provides the SystemPrompt chain mechanism through ChainMail registration, enabling system prompt customization for AI interactions
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RegistersSystemPromptChainTest.php
        
      - acceptanceCriteria: AiFeature registers template helpers in Helpers service
        criticality: contract
        intent: Integrates AI functionality into template system by registering 'complete' and 'capture' helpers, enabling declarative AI operations within templates
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RegistersTemplateHelpersTest.php

  - name: request-building
    description: AI request configuration and building
    specs:
      - acceptanceCriteria: RequestBuilder constructs Request with default configuration
        criticality: contract
        intent: Provides sensible defaults for AI API calls, allowing developers to make requests without specifying every parameter
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/ConstructsWithDefaultsTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting model
        criticality: contract
        intent: Enables model selection for different AI capabilities and performance characteristics through fluent API
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsModelTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting prompt
        criticality: contract
        intent: Enables prompt configuration for directing AI behavior through fluent API
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsPromptTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting max tokens
        criticality: contract
        intent: Enables control over response length through fluent API, preventing excessive token usage
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsMaxTokensTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting temperature
        criticality: contract
        intent: Enables control over response randomness through fluent API, allowing balance between creativity and consistency
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsTemperatureTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting stop sequences
        criticality: contract
        intent: Enables early termination of generation through fluent API when specific text patterns are encountered
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsStopSequenceTest.php
        
      - acceptanceCriteria: RequestBuilder allows setting response format
        criticality: contract
        intent: Enables structured output through JSON schema specification, ensuring AI responses match expected data structures
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/SetsResponseFormatTest.php
        
      - acceptanceCriteria: RequestBuilder builds immutable Request object
        criticality: contract
        intent: Creates immutable Request from builder configuration, ensuring request parameters cannot change during execution
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/BuildsRequestTest.php
        
      - acceptanceCriteria: RequestBuilder supports creating new instance with current configuration
        criticality: contract
        intent: Enables builder reuse through new() method, allowing base configurations to be cloned and modified
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/RequestBuilder/CreatesNewInstanceTest.php

  - name: completion-api
    description: Text completion using AI models
    specs:
      - acceptanceCriteria: Completion accepts string prompt and builds Request automatically
        criticality: contract
        intent: Simplifies common use case of completing text from string, automatically handling request construction
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/AcceptsStringPromptTest.php
        
      - acceptanceCriteria: Completion accepts pre-built Request object
        criticality: contract
        intent: Enables advanced configurations by accepting pre-configured Request objects
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/AcceptsRequestObjectTest.php
        
      - acceptanceCriteria: Completion yields text chunks from streaming API
        criticality: contract
        intent: Provides incremental response delivery through generator yielding, enabling real-time UI updates and early processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/YieldsTextChunksTest.php
        
      - acceptanceCriteria: Completion processes response buffer incrementally
        criticality: constraint
        intent: Parses streaming API responses line-by-line, preventing buffer bloat and enabling immediate chunk processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/ProcessesBufferIncrementallyTest.php
        
      - acceptanceCriteria: Completion handles stop sequences correctly
        criticality: contract
        intent: Terminates generation when stop sequence detected in output, preventing unwanted content after delimiter
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/HandlesStopSequencesTest.php
        
      - acceptanceCriteria: Completion buffers partial stop sequences
        criticality: constraint
        intent: Withholds output when buffer ends with potential stop sequence prefix, ensuring accurate stop detection across chunk boundaries
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/BuffersPartialStopSequencesTest.php
        
      - acceptanceCriteria: Completion extracts text from JSON responses when asText is true
        criticality: contract
        intent: Automatically extracts text field from API JSON, simplifying text-only use cases by hiding response structure
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/ExtractsTextFromJsonTest.php
        
      - acceptanceCriteria: Completion yields raw JSON responses when asText is false
        criticality: contract
        intent: Provides access to full API response structure including metadata when needed for advanced processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/YieldsRawJsonTest.php
        
      - acceptanceCriteria: Completion handles streaming and non-streaming responses
        criticality: contract
        intent: Supports both streaming and non-streaming API modes, adapting response processing to match API behavior
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/HandlesStreamingModesTest.php
        
      - acceptanceCriteria: Completion processes incomplete JSON lines correctly
        criticality: constraint
        intent: Retains incomplete lines in buffer between iterations, ensuring all data is processed even when responses split mid-JSON
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Completion/ProcessesIncompleteJsonTest.php

  - name: chat-api
    description: Conversational AI using chat models
    specs:
      - acceptanceCriteria: Chat accepts string prompt and builds Request automatically
        criticality: contract
        intent: Simplifies common use case of chat from string, automatically handling request construction with default system message
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/AcceptsStringPromptTest.php
        
      - acceptanceCriteria: Chat accepts pre-built Request object
        criticality: contract
        intent: Enables advanced configurations by accepting pre-configured Request objects for complex chat scenarios
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/AcceptsRequestObjectTest.php
        
      - acceptanceCriteria: Chat includes developer role system message
        criticality: contract
        intent: Establishes consistent AI behavior by including default system message defining assistant role
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/IncludesSystemMessageTest.php
        
      - acceptanceCriteria: Chat formats messages array with roles
        criticality: constraint
        intent: Constructs proper chat API request format with developer and user role messages
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/FormatsMessagesArrayTest.php
        
      - acceptanceCriteria: Chat yields text content from responses
        criticality: contract
        intent: Provides incremental response delivery through generator yielding, enabling real-time chat UI updates
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/YieldsTextContentTest.php
        
      - acceptanceCriteria: Chat extracts text from message content when asText is true
        criticality: contract
        intent: Automatically extracts message content from API JSON, simplifying text-only chat use cases
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/ExtractsMessageContentTest.php
        
      - acceptanceCriteria: Chat yields raw JSON responses when asText is false
        criticality: contract
        intent: Provides access to full API response structure including metadata for advanced chat processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/YieldsRawJsonTest.php
        
      - acceptanceCriteria: Chat includes response format in request when specified
        criticality: contract
        intent: Enables structured chat responses through JSON schema specification
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/IncludesResponseFormatTest.php
        
      - acceptanceCriteria: Chat processes response buffer incrementally
        criticality: constraint
        intent: Parses chat API responses line-by-line, preventing buffer bloat and enabling immediate chunk processing
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/Chat/ProcessesBufferIncrementallyTest.php

  - name: template-helpers
    description: AI-powered template helpers for text generation and extraction
    specs:
      - acceptanceCriteria: Complete helper generates text continuation
        criticality: contract
        intent: Provides template-based text completion, enabling AI-powered content generation within templates
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperGeneratesTextTest.php
        
      - acceptanceCriteria: Complete helper accepts max tokens parameter
        criticality: contract
        intent: Enables response length control through max parameter in template syntax
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperMaxTokensTest.php
        
      - acceptanceCriteria: Complete helper accepts stop sequence parameter
        criticality: contract
        intent: Enables early termination control through stop parameter in template syntax
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperStopSequenceTest.php
        
      - acceptanceCriteria: Complete helper supports inline mode with buffer
        criticality: contract
        intent: Completes text after template buffer when used inline, enabling context-aware completion
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperInlineModeTest.php
        
      - acceptanceCriteria: Complete helper supports block mode with instructions
        criticality: contract
        intent: Uses block content as completion instructions when used as block helper, enabling detailed guidance
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperBlockModeTest.php
        
      - acceptanceCriteria: Complete helper includes system prompt and rules
        criticality: constraint
        intent: Ensures consistent completion behavior by including comprehensive system prompt with formatting rules
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperSystemPromptTest.php
        
      - acceptanceCriteria: Complete helper yields chunks progressively
        criticality: contract
        intent: Provides incremental completion delivery through yielding, enabling real-time template rendering
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CompleteHelperYieldsChunksTest.php
        
      - acceptanceCriteria: Capture helper extracts structured data from text
        criticality: contract
        intent: Enables data extraction through AI, storing results in template data context for later use
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperExtractsDataTest.php
        
      - acceptanceCriteria: Capture helper requires target variable name as first argument
        criticality: contract
        intent: Specifies where extracted data should be stored through required argument
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperRequiresVariableNameTest.php
        
      - acceptanceCriteria: Capture helper supports inline mode with buffer as input
        criticality: contract
        intent: Extracts data from accumulated template buffer when used inline
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperInlineModeTest.php
        
      - acceptanceCriteria: Capture helper supports block mode with instructions
        criticality: contract
        intent: Uses block content as extraction instructions when used as block helper
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperBlockModeTest.php
        
      - acceptanceCriteria: Capture helper uses JSON schema response format from schema parameter or defaults to array of strings
        criticality: contract
        intent: Enables custom structured extraction by accepting optional schema parameter, falling back to default array<string> schema for backward compatibility
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperUsesJsonSchemaTest.php
        
      - acceptanceCriteria: Capture helper stores decoded JSON in template data
        criticality: contract
        intent: Parses JSON response and stores structured data in specified variable, making it accessible to subsequent template sections
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperStoresDecodedJsonTest.php

      - acceptanceCriteria: Capture helper accepts optional schema parameter for custom JSON schemas
        criticality: contract
        intent: Enables custom structured output through schema hash parameter ({{capture "data" schema=mySchema}}), allowing fine-grained control over extracted data structure
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperAcceptsSchemaParamTest.php

      - acceptanceCriteria: Capture helper resolves schema from template data context when schema parameter is string reference
        criticality: contract
        intent: Enables schema reuse by supporting context variable references in schema parameter, retrieving schema definition from template data at runtime
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperResolvesSchemaFromContextTest.php

      - acceptanceCriteria: Capture helper accepts inline JSON schema objects in schema parameter
        criticality: contract
        intent: Enables ad-hoc schema definition through inline schema objects in template syntax
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperAcceptsInlineSchemaTest.php

      - acceptanceCriteria: Capture helper validates custom schema is valid JSON Schema before API call
        criticality: contract
        intent: Prevents invalid API requests by validating schema structure matches JSON Schema specification
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/TemplateHelpers/CaptureHelperValidatesSchemaTest.php

  - name: context-helpers
    description: Direct context methods for AI operations accessible from ExtendedState
    specs:
      - acceptanceCriteria: AiFeature registers capture() method in ExtendedState context
        criticality: contract
        intent: Provides direct programmatic access to AI capture functionality from state actions without requiring template syntax
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/RegistersCaptureMethodTest.php

      - acceptanceCriteria: Context capture() method accepts prompt string as first parameter
        criticality: contract
        intent: Enables capture operations through simple function call with prompt text
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureAcceptsPromptTest.php

      - acceptanceCriteria: Context capture() method accepts optional schema parameter
        criticality: contract
        intent: Enables custom structured output by accepting JSON schema array, defaulting to array<string> schema when not provided
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureAcceptsSchemaTest.php

      - acceptanceCriteria: Context capture() method accepts optional backend parameter
        criticality: contract
        intent: Enables explicit provider selection as optional override of capability-based selection
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureAcceptsBackendTest.php

      - acceptanceCriteria: Context capture() method returns Generator yielding decoded JSON result
        criticality: contract
        intent: Provides async-compatible result delivery through generator, yielding during API call and returning decoded JSON
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureReturnsGeneratorTest.php

      - acceptanceCriteria: Context capture() method shares schema resolution logic with template helper
        criticality: constraint
        intent: Maintains consistency between template and context helpers by using shared schema processing implementation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureSharesSchemaLogicTest.php

      - acceptanceCriteria: Context capture() method shares backend resolution logic with template helper
        criticality: constraint
        intent: Maintains consistency between template and context helpers by using shared backend selection implementation
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CaptureSharesBackendLogicTest.php

      - acceptanceCriteria: AiFeature registers complete() method in ExtendedState context
        criticality: contract
        intent: Provides direct programmatic access to text completion from state actions without requiring template syntax
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/RegistersCompleteMethodTest.php

      - acceptanceCriteria: Context complete() method accepts prompt string as first parameter
        criticality: contract
        intent: Enables text completion operations through simple function call with prompt text
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CompleteAcceptsPromptTest.php

      - acceptanceCriteria: Context complete() method accepts optional backend parameter
        criticality: contract
        intent: Enables explicit provider selection as optional override of capability-based selection
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CompleteAcceptsBackendTest.php

      - acceptanceCriteria: Context complete() method returns Generator yielding completion text
        criticality: contract
        intent: Provides async-compatible result delivery through generator yielding text chunks during streaming
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ContextHelpers/CompleteReturnsGeneratorTest.php

  - name: response-format
    description: Structured response formatting with JSON schemas
    specs:
      - acceptanceCriteria: ResponseFormat accepts format type and definition
        criticality: contract
        intent: Enables structured output specification by accepting format type and schema definition
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ResponseFormat/AcceptsFormatAndDefinitionTest.php
        
      - acceptanceCriteria: ResponseFormat stores format and definition as readonly properties
        criticality: contract
        intent: Provides immutable response format configuration ensuring schema cannot change during request
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/ResponseFormat/StoresReadonlyPropertiesTest.php

  - name: integration
    description: End-to-end AI feature integration scenarios
    specs:
      - acceptanceCriteria: Completion integrates with AsyncFeature for cooperative execution
        criticality: contract
        intent: Enables non-blocking AI generation through AsyncFeature integration, allowing other tasks to execute during API calls
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Ai/CompletionIntegrationTest.php

      - acceptanceCriteria: Template helpers integrate with TemplateFeature
        criticality: contract
        intent: Provides seamless AI functionality within templates through TemplateFeature integration
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Ai/TemplateHelperIntegrationTest.php

      - acceptanceCriteria: Multiple template helpers can be used sequentially
        criticality: contract
        intent: Enables complex AI workflows by supporting multiple helper invocations within same template
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Ai/MultipleHelpersIntegrationTest.php

      - acceptanceCriteria: Captured data can be used in subsequent template sections
        criticality: contract
        intent: Enables AI-driven template logic by making extracted data available to later template sections through data context
        test: vendor/bin/phpunit tests/PHPUnit/Integration/Feature/Ai/CapturedDataFlowIntegrationTest.php

  - name: backend-mesh-infrastructure
    description: Mesh-based backend storage and access infrastructure
    specs:
      - acceptanceCriteria: AiFeature supplies Mesh containing backend instances via ChainMail
        criticality: contract
        intent: Provides backend mesh through ChainMail dependency injection, enabling features to access multiple AI backends through array-like interface
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/SuppliesBackendMeshTest.php

      - acceptanceCriteria: Backend mesh contains backends keyed by name ('openai', 'ollama', 'anthropic')
        criticality: contract
        intent: Establishes backend naming convention using provider names as keys, enabling backend selection via name rather than model patterns
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/MeshContainsNamedBackendsTest.php

      - acceptanceCriteria: Backend mesh supports array-like access pattern ($backends['openai'])
        criticality: contract
        intent: Provides intuitive backend access through ArrayAccess interface, enabling simple backend retrieval by name
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/MeshSupportsArrayAccessTest.php

      - acceptanceCriteria: Backend mesh supports extend() method for chain-based extensions
        criticality: contract
        intent: Enables chain-based backend mesh extension, allowing features to intercept backend access operations
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/MeshSupportsExtendMethodTest.php

      - acceptanceCriteria: Backend mesh supports extendWith() method for adding backend sources
        criticality: contract
        intent: Enables extending mesh with additional backend collections, allowing features to add multiple backends at once
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/MeshSupportsExtendWithMethodTest.php

      - acceptanceCriteria: Other features can add backends via array assignment ($backends['custom'] = new CustomBackend())
        criticality: contract
        intent: Provides simple backend addition mechanism, enabling features to register custom backends without complex APIs
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OtherFeaturesCanAddBackendsTest.php

  - name: backend-interface
    description: Backend abstraction contract for AI providers
    specs:
      - acceptanceCriteria: BackendInterface defines createCompletionRequest(Request) method returning array
        criticality: contract
        intent: Establishes completion request creation contract, ensuring all backends can transform generic Request to provider-specific completion API format
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/BackendInterface/DefinesCreateCompletionRequestTest.php

      - acceptanceCriteria: BackendInterface defines createChatRequest(Request) method returning array
        criticality: contract
        intent: Establishes chat request creation contract, ensuring all backends can transform generic Request to provider-specific chat API format
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/BackendInterface/DefinesCreateChatRequestTest.php

      - acceptanceCriteria: BackendInterface defines stream(Request) method returning iterable
        criticality: contract
        intent: Establishes streaming contract, ensuring all backends provide consistent streaming interface for both completion and chat
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/BackendInterface/DefinesStreamMethodTest.php

      - acceptanceCriteria: BackendInterface defines formatSystemPrompt(string) method returning string
        criticality: contract
        intent: Establishes system prompt formatting contract, enabling provider-specific prompt template application
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/BackendInterface/DefinesFormatSystemPromptTest.php

  - name: openai-backend-implementation
    description: OpenAI API backend implementation
    specs:
      - acceptanceCriteria: OpenAiBackend implements BackendInterface
        criticality: contract
        intent: Ensures OpenAI backend conforms to backend abstraction contract
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/ImplementsBackendInterfaceTest.php

      - acceptanceCriteria: OpenAiBackend createCompletionRequest() transforms Request to OpenAI completion API format
        criticality: contract
        intent: Converts generic Request object to OpenAI-specific completion request structure with proper field mapping
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/TransformsCompletionRequestTest.php

      - acceptanceCriteria: OpenAiBackend createChatRequest() transforms Request to OpenAI chat API format
        criticality: contract
        intent: Converts generic Request object to OpenAI-specific chat request structure with messages array and roles
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/TransformsChatRequestTest.php

      - acceptanceCriteria: OpenAiBackend stream() yields text chunks from OpenAI streaming API
        criticality: contract
        intent: Handles OpenAI SSE streaming format, parsing data lines and extracting text content incrementally
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/StreamsResponseChunksTest.php

      - acceptanceCriteria: OpenAiBackend formatSystemPrompt() applies OpenAI-specific prompt template
        criticality: contract
        intent: Formats system prompts according to OpenAI best practices and model-specific requirements
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/FormatsSystemPromptTest.php

      - acceptanceCriteria: OpenAiBackend accepts optional apiKey and baseUrl configuration
        criticality: contract
        intent: Enables runtime configuration of API credentials and endpoint, supporting both cloud and local deployments
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/OpenAi/AcceptsConfigurationTest.php

  - name: ollama-backend-implementation
    description: Ollama API backend implementation
    specs:
      - acceptanceCriteria: OllamaBackend implements BackendInterface
        criticality: contract
        intent: Ensures Ollama backend conforms to backend abstraction contract
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/ImplementsBackendInterfaceTest.php

      - acceptanceCriteria: OllamaBackend createCompletionRequest() transforms Request to Ollama completion API format
        criticality: contract
        intent: Converts generic Request object to Ollama-specific completion request structure with proper field mapping
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/TransformsCompletionRequestTest.php

      - acceptanceCriteria: OllamaBackend createChatRequest() transforms Request to Ollama chat API format
        criticality: contract
        intent: Converts generic Request object to Ollama-specific chat request structure with messages array
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/TransformsChatRequestTest.php

      - acceptanceCriteria: OllamaBackend stream() yields text chunks from Ollama streaming API
        criticality: contract
        intent: Handles Ollama streaming format, parsing JSON lines and extracting response content incrementally
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/StreamsResponseChunksTest.php

      - acceptanceCriteria: OllamaBackend formatSystemPrompt() applies Ollama-specific prompt template
        criticality: contract
        intent: Formats system prompts according to Ollama model-specific requirements and local deployment context
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/FormatsSystemPromptTest.php

      - acceptanceCriteria: OllamaBackend accepts optional baseUrl configuration
        criticality: contract
        intent: Enables runtime configuration of Ollama endpoint, supporting local and remote deployments
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Ollama/AcceptsConfigurationTest.php

  - name: anthropic-backend-implementation
    description: Anthropic (Claude) API backend implementation
    specs:
      - acceptanceCriteria: AnthropicBackend implements BackendInterface
        criticality: contract
        intent: Ensures Anthropic backend conforms to backend abstraction contract
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/ImplementsBackendInterfaceTest.php

      - acceptanceCriteria: AnthropicBackend createCompletionRequest() transforms Request to Anthropic completion API format
        criticality: contract
        intent: Converts generic Request object to Anthropic-specific completion request structure with proper field mapping
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/TransformsCompletionRequestTest.php

      - acceptanceCriteria: AnthropicBackend createChatRequest() transforms Request to Anthropic messages API format
        criticality: contract
        intent: Converts generic Request object to Anthropic-specific messages request structure with system parameter and messages array
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/TransformsChatRequestTest.php

      - acceptanceCriteria: AnthropicBackend stream() yields text chunks from Anthropic streaming API
        criticality: contract
        intent: Handles Anthropic SSE streaming format, parsing event types and extracting text deltas incrementally
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/StreamsResponseChunksTest.php

      - acceptanceCriteria: AnthropicBackend formatSystemPrompt() applies Anthropic-specific prompt template
        criticality: contract
        intent: Formats system prompts according to Claude model requirements and best practices
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/FormatsSystemPromptTest.php

      - acceptanceCriteria: AnthropicBackend accepts optional apiKey and baseUrl configuration
        criticality: contract
        intent: Enables runtime configuration of API credentials and endpoint, supporting both cloud and custom deployments
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/Anthropic/AcceptsConfigurationTest.php

  - name: prompt-template-chain
    description: Provider-specific prompt template resolution via chain
    specs:
      - acceptanceCriteria: AiFeature supplies PromptTemplate chain via ChainMail
        criticality: contract
        intent: Provides prompt template resolution through ChainMail dependency injection, enabling provider-specific prompt formatting
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/SuppliesPromptTemplateChainTest.php

      - acceptanceCriteria: PromptTemplate extends Chain class
        criticality: contract
        intent: Leverages Chain infrastructure for middleware-based template resolution extensibility
        test: vendor/bin/phpunit tests/PHPUnit/Unit/Feature/Ai/MultiBackend/PromptTemplate/ExtendsChainTest.php

      - acceptanceCriteria: PromptTemplate __invoke(backend, type) returns string template
