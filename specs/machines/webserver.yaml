name: webserver
group: machines
description: Asynchronous HTTP server demonstrating cooperative multitasking with spawned connection handling

features:
  - name: server-lifecycle
    description: Core server initialization on bootstrap
    specs:
      - acceptanceCriteria: Server creates non-blocking socket on entering starting state
        criticality: contract
        intent: Enables cooperative multitasking by ensuring socket operations don't block the event loop
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ServerSocketCreationTest.php
      
      - acceptanceCriteria: Server stores socket reference in extended state
        criticality: contract
        intent: Makes socket accessible to action handlers for connection acceptance
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ServerSocketStorageTest.php

  - name: connection-spawning
    description: Dynamic child region creation for incoming connections
    specs:
      - acceptanceCriteria: Server spawns child region when ServerConnection trigger is dispatched
        criticality: contract
        intent: Creates isolated state machine per connection, enabling concurrent request handling with independent lifecycles
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ConnectionSpawningTest.php
      
      - acceptanceCriteria: Spawned connection region receives the ServerConnection trigger
        criticality: contract
        intent: Passes connection context to spawned region, enabling request processing with access to client socket and request data
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ConnectionTriggerPropagationTest.php
      
      - acceptanceCriteria: Multiple connections spawn independent child regions
        criticality: contract
        intent: Enables true concurrent connection handling where each request progresses independently
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/MultipleConnectionSpawningTest.php

  - name: connection-lifecycle
    description: State transitions for individual HTTP request handling
    specs:
      - acceptanceCriteria: Connection region initializes in accept state
        criticality: contract
        intent: Establishes initial state for request processing lifecycle
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ConnectionInitialStateTest.php
      
      - acceptanceCriteria: Connection transitions from accept to processing state
        criticality: contract
        intent: Moves connection through request handling pipeline after initial setup
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/AcceptToProcessingTransitionTest.php
      
      - acceptanceCriteria: Connection stores client socket in extended state during accept
        criticality: contract
        intent: Makes client socket accessible throughout connection lifecycle for response writing
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ClientSocketStorageTest.php
      
      - acceptanceCriteria: Connection transitions from processing to close when response complete
        criticality: contract
        intent: Signals end of request handling, triggering cleanup and socket closure
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ProcessingToCloseTransitionTest.php
      
      - acceptanceCriteria: Connection closes client socket when entering close state
        criticality: constraint
        intent: Ensures proper resource cleanup by closing network connection when request completes
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/SocketCleanupTest.php

  - name: async-behavior
    description: Cooperative multitasking and non-blocking operations
    specs:
      - acceptanceCriteria: Server action handler yields control during connection acceptance loop
        criticality: contract
        intent: Enables cooperative multitasking by allowing scheduler to interleave server and connection tasks
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ServerYieldBehaviorTest.php

      - acceptanceCriteria: Connection processing handler yields control while generating response
        criticality: contract
        intent: Prevents long-running response generation from blocking other connections, maintaining responsiveness
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ConnectionYieldBehaviorTest.php

      - acceptanceCriteria: Multiple connections progress concurrently through their states
        criticality: contract
        intent: Demonstrates true async behavior where connections don't block each other, essential for scalable server operation
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Basic/ConcurrentProgressTest.php

  - name: resource-lifecycle-integration
    description: Complete resource lifecycle from accept to close in concurrent environment
    specs:
      - acceptanceCriteria: Parent accept loop removes closed client sockets from tracking after child region closes them
        criticality: contract
        intent: Prevents stream_select failures when child region closes socket but parent still references it, ensuring accept loop remains healthy
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/ClosedSocketCleanupInAcceptLoopTest.php

      - acceptanceCriteria: Server accepts new connections after previous connections close
        criticality: contract
        intent: Validates server remains operational and responsive after handling and closing connections, demonstrating proper lifecycle management
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/AcceptAfterCloseTest.php

      - acceptanceCriteria: Multiple concurrent connections with different lifecycles do not interfere
        criticality: contract
        intent: Ensures fast-completing request does not affect slow-processing request, and vice versa, validating independent lifecycle management
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/ConcurrentConnectionLifecyclesTest.php

      - acceptanceCriteria: Child region closing socket does not close parent server socket
        criticality: constraint
        intent: Prevents catastrophic failure where child's fclose() accidentally affects parent's listening socket, maintaining server availability
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/ChildCloseDoesNotAffectServerSocketTest.php

  - name: e2e-connection-flow
    description: End-to-end connection flow with real socket lifecycle and feature integration
    specs:
      - acceptanceCriteria: Complete request-response cycle maintains socket validity from accept through close
        criticality: contract
        intent: Validates entire flow where socket is accepted, stored in extended state, used for response writing, and properly closed, demonstrating all features working together
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/CompleteConnectionFlowTest.php

      - acceptanceCriteria: Socket resource remains valid during async processing with multiple yields
        criticality: contract
        intent: Ensures cooperative multitasking during response generation does not invalidate socket resource, preventing broken pipe errors
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/SocketValidityThroughAsyncProcessingTest.php

      - acceptanceCriteria: Accept loop continues processing after child region encounters error and closes
        criticality: constraint
        intent: Ensures server resilience where one failing connection does not crash accept loop, maintaining availability for other clients
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/AcceptLoopResillienceTest.php

      - acceptanceCriteria: Child region can close socket early without causing parent accept loop stream_select failure
        criticality: contract
        intent: Validates parent's resource tracking correctly handles premature socket closure, the core bug that was discovered in production
        test: vendor/bin/phpunit tests/PHPUnit/E2E/WebServer/Integration/EarlySocketCloseHandlingTest.php
