context:
  schema:
    - name: template
      type: string
      description: The message to use by the machine (this is not implemented yet)
      default: Lorem ipsum
states:
  - name: starting
    onEnter:
      # language=injectablephp
      - run: !php |
          return function(object $trigger){
            $this->set('result', null);
          };
    transitions:
      - target: templating
  - name: templating
    action:
      # language=injectablephp
      - run: !php |
          return function (object $trigger) {
            $template = $this->template($trigger->template);
            assert($template instanceof \Generator);
            $result = '';
            while ($template->valid()) {
              $chunk=$template->current();
              echo $chunk;
              $result .= $chunk;
              $template->next();
              yield;
            }
            $this->set('result', $result);
          }
    transitions:
      # language=injectablephp
      - target: finished
        guard: !php |
          return function (object $trigger):bool {
            $result=$this->get('result');
            echo $result;
            return $result!==null;
          }
  - name: finished
    onEnter:
      # language=injectablephp
      - run: !php |
          return function (object $trigger) {
            file_put_contents($trigger->outputFile,$this->get('result'));
          }

