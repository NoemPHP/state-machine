states:
  - name: off
    transitions:
      - target: starting
  - name: starting
    spawn:
      # language=injectablephp
      - guard: !php |
          return function(ServerConnection $c):bool{
            return true;
          }
        shared:
          meta: false
        region:
          context:
            schema:
              - name: systemPrompt
                type: string
                description: The system prompt to use by the AI
                default: |
                  You are an auto-complete utility that produces raw source code for immediate execution. 
                  Your task is to produce beautiful HTML pages about any subject you encounter.
                  You return nothing but raw HTML, JS and CSS code in plaintext. Do not wrap your output in any other tags or characters. 
                  Do not include any comments or explanations. Do not use any external libraries or frameworks.
              - name: bodyTemplate
                type: string
                description: The template that renders all file contents condensed as a single piece of text
                # language=html
                default: |
                  <html lang="en">

                  <head>
                      <title>Noem Regions</title>
                  </head>
                  <body>
                      <header>Hi, this is Noem</header>
                      <p>
                          {{#complete max=64 stop='</title>'}}
                          {{systemPrompt}}
                          Write a humorous, nerdy paragraph about how awesome finite state machines are
                          {{/complete}}
                      </p>
                  </body>
                  </html>
              - name: bodyTemplateBAK
                type: string
                description: The template that renders all file contents condensed as a single piece of text
                # language=html
                default: |
                  <html lang="en">

                  <head>
                      <title>
                          {{#complete max=64 stop='</title>'}}
                      {{systemPrompt}}
                      # Task
                      Write the title of a personal blog about family life and organization.
                      Text of the title only! Do not proceed with markup
                      {{/complete}}
                      </title>

                      {{#complete max=512}}
                      {{systemPrompt}}
                      # Task
                      Complete this HTML head section of a personal blog about family life and organization.
                      Generate light CSS styles that match the content.
                      Output until the closing tag, but do not out the closing tag
                      {{/complete}}
                  </head>
                  <body>
                  {{#complete max=512}}
                  {{systemPrompt}}
                  # Task
                  Complete the HTML body section of a personal blog about family life and organization.
                  Output until the closing tag, but do not out the closing tag
                  {{/complete}}
                  </body>
                  </html>
          states:
            - name: accept
              transitions:
                - target: processing
              action:
                # language=injectablephp
                - run: !php |
                    return function(ServerConnection $connection){
                      // Handle the accepted connection here
                      echo "Connection accepted\n";
                      $client = $connection->client;
                      // Read a large chunk of data from the client
                      $buffer = fread($client, 65536);
                      if ($buffer === false || $buffer === '') {
                        fclose($client);
                        return;
                      }
                      
                      // Split the request into headers and body (if any)
                      $parts = explode("\r\n\r\n", $buffer, 2);
                      $head = $parts[0];
                      $body = $parts[1] ?? '';
                      
                      // Split the head into individual lines
                      $headerLines = explode("\r\n", $head);
                      $headers = [];
                      foreach ($headerLines as $headerLine) {
                        if (strpos($headerLine, ':') !== false) {
                          list($key, $value) = explode(':', $headerLine, 2);
                          $headers[trim($key)] = trim($value);
                        }
                      }
                    
                      $this->set('client', $client);
                      $this->set('headers', $headers);
                      $this->set('body', $body);
                    
                      // Display the received HTTP request
                      foreach ($headers as $name => $value) {
                        //echo "  $name: $value\n";
                      }
                      echo $body.PHP_EOL;
                    }
            - name: processing
              action:
                # language=injectablephp
                - run: !php |
                    return function(object $trigger){
                      $client = $this->get('client');
                      $headers=$this->get('headers' );
                      var_dump($headers);
                      $id =get_resource_id($client);
                      //echo "Processing request $id: {$headers['Referer']}\n";
                      
                      if(!is_resource($client) || feof($client)){
                        return;
                      }
                      //var_dump($client);
                      $response   = "HTTP/1.1 200 OK\r\n"
                      . "Connection: close\r\n"
                      . "Content-Type: text/html\r\n"
                      . "Date: " . gmdate('r') . "\r\n"
                      . "\r\n";
                      $this->set('resourceId', get_resource_id($client));
                      @fwrite($client, $response);
                      $template = $this->template($this->get('bodyTemplate'));
                      assert($template instanceof \Generator);
                      $result = '';
                      while ($template->valid()) {
                        $chunk = $template->current();
                        if(!is_resource($client) || feof($client)){
                          break;
                        }
                        @fwrite($client, $chunk);
                        
                        //echo $chunk;
                        $result .= $chunk;
                        
                        $template->next();
                        yield;
                      }
                      echo "Template rendering finished. Closing connection\n";
                      $this->set('close', true);
                      
                    }
              transitions:
                - target: close
                  # language=injectablephp
                  guard: !php |
                    return function(object $trigger): bool{
                      $close = $this->get('close');
                      return $close === true;
                    }
            - name: close
              onEnter:
                # language=injectablephp
                - run: !php |
                    return function(object $trigger){
                      $client = $this->get('client');
                      $id =get_resource_id($client);
                      echo "Closing request $id\n";
                      fclose($client);
                    }
    onEnter:
      # language=injectablephp
      - run: !php |
          return function(object $trigger){
            // Set up the socket server on port 8080
            $ctx = stream_context_create([
              'socket' => [
                'backlog' => 511,  // Configure the kernel backlog size
                'so_reuseport' => true,  // Allow reconnection to a recently closed port
              ]
            ]);
            // Create a TCP/IP socket
            $server = stream_socket_server(
              "tcp://0.0.0.0:8080", 
              $errno, 
              $errstr, 
              STREAM_SERVER_BIND | STREAM_SERVER_LISTEN, $ctx
            );
            
            if (!$server) {
              die("Server creation failed: $errstr ($errno)");
            }
            
            stream_set_blocking($server,0);
            
            echo "Listening on port 8080...\n";
            
            $this->set('server', $server);
          }

    action:
      # language=injectablephp
      - run: !php |
          use \Noem\State\Feature\Async\Call;
          return function(object $trigger){
            $server = $this->get('server');
          
            // Set the server socket to non-blocking mode
            echo "Accepting connections...\n";
            yield;
            while(true){
                $read  = array( $server );
                $array = array();
            
                if ( stream_select( $read, $array, $array, 0 )) {
                  $client = stream_socket_accept( $server, 0, $peerName );
                  //var_dump(stream_get_meta_data($client));
                  //var_dump(stream_socket_get_name($client, true));
                  //echo "PeerName: $peerName\n";
                  $this->dispatch(new ServerConnection($client));
                } else {
                  yield;
                }
            }
          }
#    transitions:
#      - target: lol

  - name: finished
