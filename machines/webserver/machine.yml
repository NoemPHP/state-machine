states:
  - name: off
    transitions:
      - target: starting
  - name: starting
    spawn:
      # language=injectablephp
      - guard: !php |
          return function(ServerConnection $c):bool{
            return true;
          }
        shared:
          meta: false
        region:
          context:
            schema:
              - name: systemPrompt
                type: string
                description: The system prompt to use by the AI
                default: |
                  You are an auto-complete utility that produces raw source code for immediate execution. 
                  Your task is to produce beautiful HTML pages about any subject you encounter.
                  You return nothing but raw HTML, JS and CSS code in plaintext. Do not wrap your output in any other tags or characters. 
                  Do not include any comments or explanations. Do not use any external libraries or frameworks.
              - name: bodyTemplate
                type: string
                description: The template that renders all file contents condensed as a single piece of text
                # language=html
                default: |
                  <html lang="en">

                  <head>
                      <title>Noem Regions</title>
                  </head>
                  <body>
                  <header>Hi, this is Noem
                  </header>
                  <p>
                      {{#complete max=64 stop='</title>'}}
                      {{systemPrompt}}
                      Write a humorous, nerdy paragraph about how awesome finite state machines are
                      {{/complete}}
                  </p>
                  <span>END</span>
                  </body>
                  </html>
              - name: bodyTemplateBAK
                type: string
                description: The template that renders all file contents condensed as a single piece of text
                # language=html
                default: |
                  <html lang="en">

                  <head>
                      <title>
                          {{#complete max=64 stop='</title>'}}
                      {{systemPrompt}}
                      # Task
                      Write the title of a personal blog about family life and organization.
                      Text of the title only! Do not proceed with markup
                      {{/complete}}
                      </title>

                      {{#complete max=512}}
                      {{systemPrompt}}
                      # Task
                      Complete this HTML head section of a personal blog about family life and organization.
                      Generate light CSS styles that match the content.
                      Output until the closing tag, but do not out the closing tag
                      {{/complete}}
                  </head>
                  <body>
                  {{#complete max=512}}
                  {{systemPrompt}}
                  # Task
                  Complete the HTML body section of a personal blog about family life and organization.
                  Output until the closing tag, but do not out the closing tag
                  {{/complete}}
                  </body>
                  </html>
          states:
            - name: accept
              transitions:
                - target: processing
              action:
                - run: !get request.action.accept
            - name: processing
              action:
                - run: !get request.action.processing
              transitions:
                - target: close
                  guard: !get transition.guard.processing.close
            - name: close
              onEnter:
                - run: !get request.onEnter.close
    onEnter:
      - run: !get server.starting.onEnter
    action:
      - run: !get server.starting.accept
  #    transitions:
  #      - target: lol

  - name: finished
