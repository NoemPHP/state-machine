states:
  - name: preparing
    transitions:
      - target: adventuring

  - name: adventuring
    onEnter:
      # Like, literally
      - run: !php return bootstrap()
    action:
      # Process the next step(s) and calculate distance traveled
      - run: !php return takeStep()
      # Let's have Frodo write a diary entry every other day or so
      - run: !php return writeDiary(12)
      # Have some sort of narrator voice dictate the current situation of Frodo in a lore-accurate manner
      - run: !php return assessSetting(12)
    regions:
      - states:
          # 1️⃣ Hobbiton (Shire) → Brandywine Bridge (≈70km)
          - name: hobbiton
            transitions:
              - target: hobbiton|brandywine
          - name: hobbiton|brandywine
            onEnter:
              - run: !php return setDistanceToDestination(70, 'brandywine')
            transitions:
              - target: brandwine
                guard: !php return isDestinationReached()
          - name: brandwine
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: brandwine|bree

          # 2️⃣ Brandywine Bridge → Bree (≈10km)
          - name: brandwine|bree
            onEnter:
              - run: !php return setDistanceToDestination(10, 'bree')
            transitions:
              - target: bree
                guard: !php return isDestinationReached()
          - name: bree
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: bree|rivendell
          # 3️⃣ Bree → Rivendell (≈160km)
          - name: bree|rivendell
            onEnter:
              - run: !php return setDistanceToDestination(160, 'rivendell')
            transitions:
              - target: rivendell
                guard: !php return isDestinationReached()
          - name: rivendell
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: rivendell|moria
          # 4️⃣ Rivendell → Moria (≈200km)
          - name: rivendell|moria
            onEnter:
              - run: !php return setDistanceToDestination(200, 'moria')
            transitions:
              - target: moria
                guard: !php return isDestinationReached()
          - name: moria
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: moria|lothlorien
          # 5️⃣ Moria → Lothlórien (≈230km)
          - name: moria|lothlorien
            onEnter:
              - run: !php return setDistanceToDestination(230, 'lothlorien')
            transitions:
              - target: lothlorien
                guard: !php return isDestinationReached()
          - name: lothlorien
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: lothlorien|deadmarshes
          # 6️⃣ Lothlórien → Dead Marshes (≈45km)
          - name: lothlorien|deadmarshes
            onEnter:
              - run: !php return setDistanceToDestination(45, 'deadmarshes')
            transitions:
              - target: deadmarshes
                guard: !php return isDestinationReached()
          - name: deadmarshes
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: deadmarshes|osgiliath
          # 7️⃣ Dead Marshes → Osgiliath (≈180km)
          - name: deadmarshes|osgiliath
            onEnter:
              - run: !php return setDistanceToDestination(180, 'osgiliath')
            transitions:
              - target: osgiliath
                guard: !php return isDestinationReached()
          - name: osgiliath
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: osgiliath|minas_tirith
          # 8️⃣ Osgiliath → MinasTirith (≈90km)
          - name: osgiliath|minas_tirith
            onEnter:
              - run: !php return setDistanceToDestination(90, 'minas_tirith')
            transitions:
              - target: minas_tirith
                guard: !php return isDestinationReached()
          - name: minas_tirith
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: minas_tirith|blackgate
          # 9️⃣ MinasTirith → The Black Gate (≈60km)
          - name: minas_tirith|blackgate
            onEnter:
              - run: !php return setDistanceToDestination(60, 'blackgate')
            transitions:
              - target: blackgate
                guard: !php return isDestinationReached()
          - name: blackgate
            onEnter:
              - run: !php return hasReachedDestination()
            transitions:
              - target: blackgate|mountdoom
          # 🔟 The Black Gate → MountDoom (≈130km)
          - name: blackgate|mountdoom
            onEnter:
              - run: !php return setDistanceToDestination(130, 'mountdoom')
            transitions:
              - target: mountdoom
                guard: !php return isDestinationReached()
          - name: mountdoom
            onEnter:
              - run: !php return hasReachedDestination()

    transitions:
      - target: finish

  - name: finish
