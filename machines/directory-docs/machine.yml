context:
  schema:
    - name: systemPrompt
      type: string
      description: The system prompt to use by the AI
      default: |
        Assume the role of an IT engineering expert with profound experience with WordPress & WooCommerce.
        You will be given text processing/completion tasks instructing you to provide the desired output for further processing.
        So pay attention to organically mesh your output with the preceding content and avoid redundancies and repetitive introductions.
        Thus, you are forbidden from engaging in any kind of conversation and you must never add any context, examples and explanations.
        Never refer to the context you are given, so avoid saying things like "Based on the provided code (...)".
        Use structured, organized language. Ask clarifying questions to gather essential information and present your thoughts in a clear, methodical manner.
        Omit needless words. Vigorous writing is concise. A sentence should contain no unnecessary words, a paragraph no unnecessary sentences, for the same reason that a drawing should have no unnecessary lines and a machine no unnecessary parts. This requires not that the writer make all their sentences short, or that they avoid all detail and treat their subjects only in outline, but that they make every word tell.
        Use the active voice. Prefer concrete, physical language and analogies.
    - name: allFilesTemplate
      type: string
      description: The template that renders all file contents condensed as a single piece of text
      default: |
        {{#each files}}
        ## File: {{this}}
        {{include this}}{{/each}}

states:
  - name: off
    transitions:
      - target: starting
  - name: starting
    action:
      # language=injectablephp
      - run: !php |
          return function(object $trigger){
            $directories = [];
            // Helper function to traverse directories recursively
            $traverse = function (string $dir, int $level) use (&$directories, &$traverse) {
                if (!is_dir($dir)) {
                return;
              }
            
               $entries = scandir($dir);
              foreach ($entries as $entry) {
                  if ($entry === '.' || $entry === '..') {
                      continue;
                  }
              
                $path = $dir . DIRECTORY_SEPARATOR . $entry;
                if (is_dir($path)) {
                  $directories[$level][] = $path;
                  $traverse($path, $level + 1);
                }
              }
            };
            // Start traversal from the root directory
            $traverse($trigger->workingDir, 0);
            // Sort directories by level of nesting
            ksort($directories);
            // Flatten the array of arrays into a single flat list
            $flatDirectories = [];
            foreach ($directories as $levelDirs) {
              $flatDirectories = array_merge($flatDirectories, $levelDirs);
              $this->set('directories', array_reverse($flatDirectories));
            }
          }
    transitions:
      - target: prepareDirectory
  - name: prepareDirectory
    action:
      # language=injectablephp
      - run: !php |
          return function(object $trigger){
            $this->set('files', null);
            $this->set('result', null);
            $directories = $this->get('directories');
            if (!empty($directories)) {
                $currentDir = array_shift($directories);
                $this->set('directories', $directories);
                $this->set('currentDir', $currentDir);
            }
          }
    transitions:
      - target: templating
  - name: templating
    action:
      # language=injectablephp
      - run: !php |
          use \Noem\State\Feature\Async\Call;
          return function (object $trigger) {
          echo 'was ist los?'.PHP_EOL;
            $this->set('result', 'lol');
            return;
            $files=glob($this->get('currentDir').'/*.{js,php}', \GLOB_BRACE);
            $this->set('files', $files);
            $this->set('allFiles', yield Call::call($this->template($this->get('allFilesTemplate'))));
          
            $template = $this->template($trigger->template);
            assert($template instanceof \Generator);
            $result = '';
            while ($template->valid()) {
              $chunk=$template->current();
              echo $chunk;
              $result .= $chunk;
              $template->next();
              yield;
            }
            $this->set('result', $result);
            
          }
    transitions:
      - target: flush
        # language=injectablephp
        guard: !php |
          return function (object $trigger):bool {
            $result=$this->get('result');
            echo $result;
            return $result!==null;
          }
  - name: flush
    onEnter:
      # language=injectablephp
      - run: !php |
          return function (object $trigger) {
            file_put_contents($this->get('currentDir').'/README.md',$this->get('result'));
          }
    transitions:
      - target: prepareDirectory
        # language=injectablephp
        guard: !php |
          return function (object $trigger):bool {
            echo 'checking dirs'; 
            var_dump(empty($this->get('directories')));
            return !empty($this->get('directories'));
          }
      - target: finished
        # language=injectablephp
        guard: !php |
          return function (object $trigger):bool {
            return empty($this->get('directories'));
          }
  - name: finished
